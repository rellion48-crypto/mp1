<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두두자격지원센터 - 접수 관리 어드민</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #3b82f6;
            --accent: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: var(--primary);
        }

        .main-container {
            max-width: 1300px;
            margin: 32px auto;
            padding: 0 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: #60a5fa;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .search-input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 10px 16px;
            color: var(--text-main);
            outline: none;
            font-size: 14px;
            width: 280px;
        }

        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            overflow-x: auto;
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        th {
            font-size: 13px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        td {
            font-size: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-complete { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-progress { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

        .btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 9px 18px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover { background: #2563eb; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); padding: 5px 10px; font-size: 12px; }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="../index.html" class="logo">
                <div class="logo-badge">두</div>
                <div class="logo-text">
                    <h1>두두자격지원센터 (접수 관리 어드민)</h1>
                    <p style="font-size: 11px; color: var(--text-sub);">실시간 원서접수 대장 & 수기 업무 대체 시스템</p>
                </div>
            </a>
            <nav class="nav-links">
                <a href="../index.html" class="nav-btn">1. 접수 화면</a>
                <a href="../faq-admin/index.html" class="nav-btn">4. FAQ 어드민</a>
            </nav>
        </div>
    </header>

    <div class="main-container">
        <div class="controls-bar">
            <div>
                <h2>📋 실시간 원서접수 신청 대장</h2>
                <p style="font-size: 13px; color: var(--text-sub); margin-top: 4px;">
                    워드 접수대장 동시 덮어쓰기 문제 해결: Supabase DB 실시간 동기화
                </p>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="adminSearch" class="search-input" placeholder="이름, 연락처, 자격증 검색..." oninput="filterTable()">
                <button class="btn" onclick="fetchApplications()">새로고침</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">총 접수 건수</div>
                <div class="stat-value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">오늘 접수 건수</div>
                <div class="stat-value" id="todayCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">기능사 4종 접수</div>
                <div class="stat-value" id="techCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">보건/전문자격 접수</div>
                <div class="stat-value" id="otherCount">0</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>순번/ID</th>
                        <th>신청자 성함</th>
                        <th>연락처</th>
                        <th>자격증 종목</th>
                        <th>접수 상태</th>
                        <th>신청 일시</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="appTableBody">
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-sub); padding: 30px;">접수 내역을 불러오는 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://amlznptemtbkhyuzdkmu.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtbHpucHRlbXRia2h5dXpka211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNzcxMTQsImV4cCI6MjEwMjY1MzExNH0.DY_P3C5G136AuhSYAn7RvMKQfEOPxKmN-wI__f3fjfg";
        
        let supabase = null;
        if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let allApplications = [];

        async function fetchApplications() {
            const tbody = document.getElementById('appTableBody');
            if (!supabase) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Supabase Client Error</td></tr>';
                return;
            }

            try {
                const { data, error } = await supabase
                    .from('applications')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allApplications = data || [];
                updateStats(allApplications);
                renderTable(allApplications);
            } catch (err) {
                console.error('Fetch error:', err);
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #f87171;">데이터 조회 실패: ${err.message}</td></tr>`;
            }
        }

        function updateStats(data) {
            document.getElementById('totalCount').textContent = data.length;
            
            const todayStr = new Date().toISOString().slice(0, 10);
            const todayItems = data.filter(item => (item.created_at || '').startsWith(todayStr));
            document.getElementById('todayCount').textContent = todayItems.length;

            const techQuals = ['한식조리기능사', '지게차운전기능사', '굴착기운전기능사', '전기기능사'];
            const techItems = data.filter(item => techQuals.includes(item.qualification || item.license_name));
            document.getElementById('techCount').textContent = techItems.length;
            document.getElementById('otherCount').textContent = data.length - techItems.length;
        }

        function renderTable(data) {
            const tbody = document.getElementById('appTableBody');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-sub); padding: 30px;">등록된 접수 내역이 없습니다.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map((item, idx) => {
                const name = item.name || item.applicant_name || '-';
                const phone = item.phone || item.contact || '-';
                const qual = item.qualification || item.license_name || '-';
                const status = item.status || '접수완료';
                const date = item.created_at ? new Date(item.created_at).toLocaleString('ko-KR') : '-';

                return `
                    <tr>
                        <td>#${item.id || idx + 1}</td>
                        <td><strong>${name}</strong></td>
                        <td>${phone}</td>
                        <td><span style="color:#60a5fa; font-weight:600;">${qual}</span></td>
                        <td><span class="status-badge status-complete">${status}</span></td>
                        <td style="color:var(--text-sub); font-size:13px;">${date}</td>
                        <td>
                            <button class="btn-danger" onclick="deleteApp(${item.id})">삭제</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterTable() {
            const query = document.getElementById('adminSearch').value.trim().toLowerCase();
            if (!query) {
                renderTable(allApplications);
                return;
            }
            const filtered = allApplications.filter(item => {
                const name = (item.name || item.applicant_name || '').toLowerCase();
                const phone = (item.phone || item.contact || '').toLowerCase();
                const qual = (item.qualification || item.license_name || '').toLowerCase();
                return name.includes(query) || phone.includes(query) || qual.includes(query);
            });
            renderTable(filtered);
        }

        async function deleteApp(id) {
            if (!confirm('이 접수 내역을 삭제하시겠습니까?')) return;
            try {
                if (supabase) {
                    await supabase.from('applications').delete().eq('id', id);
                }
                fetchApplications();
            } catch (err) {
                alert('삭제 실패: ' + err.message);
            }
        }

        window.onload = fetchApplications;
    </script>
    <!-- Floating Chatbot Widget -->
    <script src="../chatbot.js"></script>
</body>
</html>
