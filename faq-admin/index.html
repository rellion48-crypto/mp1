<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두두자격지원센터 - 안내 규정 및 FAQ 관리 시스템 (ADMIN)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-page: #0b1120;
            --card-bg: #1e293b;
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent-purple: #8b5cf6;
            --accent-green: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
            font-size: 14px;
        }

        header {
            background: #0f172a;
            border-bottom: 1px solid var(--card-border);
            padding: 14px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--accent-purple), var(--primary));
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--primary);
        }

        .main-container {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 24px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: var(--text-main); border: 1px solid var(--card-border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-input, .form-select {
            background: #090d16;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            color: var(--text-main);
            outline: none;
            font-size: 13px;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
        }

        .faq-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 18px;
        }

        .faq-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .faq-card:hover {
            border-color: var(--accent-purple);
            transform: translateY(-2px);
        }

        .tag-group {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .tag-category { background: rgba(139, 92, 246, 0.2); color: #c084fc; }
        .tag-qual { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }
        .tag-unknown { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .faq-q {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .faq-a {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.5;
            background: #090d16;
            padding: 12px;
            border-radius: var(--radius-md);
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .faq-meta {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 14px;
        }

        .faq-card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 30px;
            max-width: 560px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f1f5f9;
        }

        .form-textarea {
            width: 100%;
            background: #090d16;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 13px;
            min-height: 100px;
            outline: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="../index.html" class="logo">
                <div class="logo-badge">규정</div>
                <div class="logo-text">
                    <h1>두두자격지원센터 (사내 안내 규정 관리)</h1>
                </div>
            </a>
            <nav class="nav-links">
                <a href="../index.html" class="nav-btn">← 원서접수 메인 포털</a>
                <a href="../admin/index.html" class="nav-btn">접수 관리 대장</a>
            </nav>
        </div>
    </header>

    <div class="main-container">
        <div class="action-bar">
            <div>
                <h2 style="font-size: 22px; font-weight: 800;">📖 사내 자격증 안내 규정 & AI 챗봇 지식베이스</h2>
                <p style="font-size: 13px; color: var(--text-sub); margin-top: 4px;">
                    시험 일정, 수수료, 환불 규정을 수정하면 챗봇의 답변에 실시간으로 즉시 반영됩니다.
                </p>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-secondary" onclick="loadDocs()">🔄 규정 새로고침</button>
                <button class="btn btn-primary" onclick="openModal()">+ 새 규정 항목 추가</button>
            </div>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchFaq" class="form-input" placeholder="질문, 키워드, 답변 내용 검색..." style="flex: 1; min-width: 240px;" oninput="renderList()">
            <select id="filterCategory" class="form-select" onchange="renderList()">
                <option value="ALL">전체 카테고리</option>
                <option value="응시료">응시료 (수수료)</option>
                <option value="일정">시험 일정 및 기간</option>
                <option value="결제/환불">결제 및 환불 규정</option>
                <option value="유효기간">필기합격 유효기간</option>
                <option value="시험준비물">준비물 및 지참물</option>
                <option value="접수방법">접수 방법</option>
                <option value="실기문의">실기 문의</option>
                <option value="확인불가">사내 미확인 항목 (거절)</option>
            </select>
        </div>

        <div class="faq-grid" id="faqGrid"></div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-card">
            <h3 id="modalTitle" style="font-size: 18px; font-weight: 800; margin-bottom: 16px;">안내 규정 편집</h3>
            <form id="faqEditForm" onsubmit="saveDoc(event)">
                <input type="hidden" id="docId">

                <div class="form-group">
                    <label class="form-label">구분 카테고리</label>
                    <select id="docCategory" class="form-select" style="width: 100%;">
                        <option value="응시료">응시료 (수수료)</option>
                        <option value="일정">시험 일정 및 기간</option>
                        <option value="결제/환불">결제 및 환불 규정</option>
                        <option value="유효기간">필기합격 유효기간</option>
                        <option value="시험준비물">준비물 및 지참물</option>
                        <option value="접수방법">접수 방법</option>
                        <option value="실기문의">실기 문의</option>
                        <option value="확인불가">사내 미확인 항목</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">대상 자격증</label>
                    <input type="text" id="docQual" class="form-input" style="width: 100%;" placeholder="예: 기능사 4종, 요양보호사, 공통">
                </div>

                <div class="form-group">
                    <label class="form-label">규정 질문 (Question)</label>
                    <input type="text" id="docQuestion" class="form-input" style="width: 100%;" required placeholder="예: 전기기능사 시험 일정은 언제인가요?">
                </div>

                <div class="form-group">
                    <label class="form-label">검색 키워드 (쉼표 구분)</label>
                    <input type="text" id="docKeywords" class="form-input" style="width: 100%;" required placeholder="예: 전기, 전기기능사, 일정, 언제, 접수기간">
                </div>

                <div class="form-group">
                    <label class="form-label">챗봇 답변 내용 (Answer)</label>
                    <textarea id="docAnswer" class="form-textarea" required placeholder="챗봇이 사용자에게 응답할 공식 답변 문구를 작성하세요."></textarea>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="docIsUnknown" style="width: 18px; height: 18px;">
                    <label for="docIsUnknown" style="font-size: 13px; color: #f87171;">확인 불가 항목 ('모르겠습니다' 답변 강제)</label>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button>
                    <button type="submit" class="btn btn-primary">규정 저장 및 챗봇 동기화</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_CONFIG = {
            URL: "https://amlznptemtbkhyuzdkmu.supabase.co",
            ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtbHpucHRlbXRia2h5dXpka211Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNzcxMTQsImV4cCI6MjEwMjY1MzExNH0.DY_P3C5G136AuhSYAn7RvMKQfEOPxKmN-wI__f3fjfg"
        };

        if (window.supabase && typeof window.supabase.createClient === 'function' && !window.supabaseClient) {
            window.supabaseClient = window.supabase.createClient(SUPABASE_CONFIG.URL, SUPABASE_CONFIG.ANON_KEY);
        }

        let allDocs = [];

        async function loadDocs() {
            const client = window.supabaseClient;
            if (client) {
                try {
                    const { data, error } = await client
                        .from('faq_documents')
                        .select('*')
                        .order('id', { ascending: true });

                    if (!error && data && data.length > 0) {
                        allDocs = data;
                        renderList();
                        return;
                    }
                } catch (e) {
                    console.log('Fetch note:', e);
                }
            }

            if (typeof DEFAULT_FAQ_KNOWLEDGE !== 'undefined') {
                allDocs = [...DEFAULT_FAQ_KNOWLEDGE];
            }
            renderList();
        }

        function renderList() {
            const container = document.getElementById('faqGrid');
            const search = document.getElementById('searchFaq').value.trim().toLowerCase();
            const cat = document.getElementById('filterCategory').value;

            const filtered = allDocs.filter(d => {
                const matchSearch = !search ||
                    (d.question && d.question.toLowerCase().includes(search)) ||
                    (d.answer && d.answer.toLowerCase().includes(search)) ||
                    (d.keywords && d.keywords.toLowerCase().includes(search));

                const matchCat = cat === 'ALL' || d.category === cat;
                return matchSearch && matchCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-sub);">조건에 맞는 안내 규정이 없습니다.</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div class="faq-card">
                    <div>
                        <div class="tag-group">
                            <span class="tag tag-category">${item.category || '공통'}</span>
                            <span class="tag tag-qual">${item.qualification || '공통'}</span>
                            ${item.is_unknown ? '<span class="tag tag-unknown">확인불가(거절)</span>' : ''}
                        </div>
                        <div class="faq-q">Q. ${item.question}</div>
                        <div class="faq-a">A. ${item.answer}</div>
                        <div class="faq-meta">🔑 <strong>키워드:</strong> ${item.keywords || '-'}</div>
                    </div>
                    <div class="faq-card-actions">
                        <button class="btn btn-secondary" style="padding: 5px 12px; font-size: 12px;" onclick="openModal(${item.id})">규정 수정</button>
                        <button class="btn btn-secondary" style="padding: 5px 12px; font-size: 12px; color: #ef4444;" onclick="deleteDoc(${item.id})">삭제</button>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id = null) {
            document.getElementById('docId').value = id || '';
            document.getElementById('modalTitle').textContent = id ? '사내 안내 규정 수정' : '새 안내 규정 등록';

            if (id) {
                const item = allDocs.find(d => d.id == id);
                if (item) {
                    document.getElementById('docCategory').value = item.category || '응시료';
                    document.getElementById('docQual').value = item.qualification || '공통';
                    document.getElementById('docQuestion').value = item.question || '';
                    document.getElementById('docKeywords').value = item.keywords || '';
                    document.getElementById('docAnswer').value = item.answer || '';
                    document.getElementById('docIsUnknown').checked = !!item.is_unknown;
                }
            } else {
                document.getElementById('faqEditForm').reset();
            }

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveDoc(e) {
            e.preventDefault();
            const id = document.getElementById('docId').value;
            const payload = {
                category: document.getElementById('docCategory').value,
                qualification: document.getElementById('docQual').value.trim(),
                question: document.getElementById('docQuestion').value.trim(),
                keywords: document.getElementById('docKeywords').value.trim(),
                answer: document.getElementById('docAnswer').value.trim(),
                is_unknown: document.getElementById('docIsUnknown').checked,
                updated_at: new Date().toISOString()
            };

            const client = window.supabaseClient;
            try {
                if (client) {
                    if (id) {
                        await client.from('faq_documents').update(payload).eq('id', parseInt(id, 10));
                    } else {
                        await client.from('faq_documents').insert([payload]);
                    }
                }
            } catch (err) {
                console.warn('Save note:', err);
            }

            if (id) {
                const idx = allDocs.findIndex(d => d.id == id);
                if (idx !== -1) allDocs[idx] = { ...allDocs[idx], ...payload };
            } else {
                payload.id = Date.now();
                allDocs.push(payload);
            }

            if (window.duduChat) {
                window.duduChat.knowledgeBase = [...allDocs];
            }

            closeModal();
            renderList();
            alert('규정이 성공적으로 저장되었으며, 챗봇 답변에 즉시 반영되었습니다.');
        }

        async function deleteDoc(id) {
            if (!confirm('이 안내 규정을 삭제하시겠습니까?')) return;
            const client = window.supabaseClient;
            try {
                if (client) {
                    await client.from('faq_documents').delete().eq('id', parseInt(id, 10));
                }
            } catch (e) {
                console.warn('Delete note:', e);
            }
            allDocs = allDocs.filter(d => d.id != id);
            if (window.duduChat) {
                window.duduChat.knowledgeBase = [...allDocs];
            }
            renderList();
        }

        window.onload = loadDocs;
    </script>
    <!-- Floating AI FAQ Chatbot Widget -->
    <script src="../chatbot.js"></script>
</body>
</html>
